<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="WKB Headshop">
  <defs>
    <linearGradient id="wkbRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="0.4" stop-color="#00e5ff"/>
      <stop offset="0.7" stop-color="#b026ff"/>
      <stop offset="1" stop-color="#ff6b00"/>
    </linearGradient>
    <linearGradient id="wkbText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39ff14"/>
      <stop offset="0.5" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#b026ff"/>
    </linearGradient>
    <filter id="wkbGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- fundo do emblema -->
  <circle cx="120" cy="120" r="112" fill="#0b0b12"/>
  <circle cx="120" cy="120" r="110" fill="none" stroke="url(#wkbRing)" stroke-width="6" filter="url(#wkbGlow)"/>
  <circle cx="120" cy="120" r="96" fill="none" stroke="#1e1e2c" stroke-width="2"/>

  <!-- fumaça / brisa -->
  <g filter="url(#wkbGlow)" opacity="0.9">
    <path d="M120 150 c14 -8 14 -22 0 -30 c-14 -8 -14 -22 0 -30"
      fill="none" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M138 150 c14 -8 14 -22 0 -30 c-14 -8 -14 -22 0 -30"
      fill="none" stroke="#39ff14" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M102 150 c14 -8 14 -22 0 -30 c-14 -8 -14 -22 0 -30"
      fill="none" stroke="#b026ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- WKB -->
  <text x="120" y="128" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
    font-size="62" font-weight="900" fill="url(#wkbText)" filter="url(#wkbGlow)" letter-spacing="2">WKB</text>

  <!-- HEADSHOP -->
  <text x="120" y="168" text-anchor="middle" font-family="Arial, sans-serif"
    font-size="17" font-weight="700" fill="#ffe600" letter-spacing="6" filter="url(#wkbGlow)">HEADSHOP</text>
</svg>
